<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You - ZebroCredd</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body { background: #f9f9f9; color: #222; }

    /* HERO SECTION */
    .hero {
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
        url('https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1600&q=80')
        center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #fff;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(255,204,0,0.2), transparent 70%);
      animation: glowMove 8s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes glowMove {
      0% { transform: translate(-30px, -30px); }
      100% { transform: translate(30px, 30px); }
    }

    .hero h1, .hero p, .hero a {
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(40px);
      animation: fadeUp 1s ease forwards;
    }

    .hero h1 { font-size: 2.8rem; animation-delay: 0.2s; }
    .hero p { font-size: 1.2rem; margin-top: 15px; max-width: 600px; animation-delay: 0.5s; }

    .hero a {
      margin-top: 30px;
      display: inline-block;
      background: #ffcc00;
      color: #000;
      padding: 12px 30px;
      border-radius: 30px;
      font-weight: 600;
      text-decoration: none;
      font-size: 1rem;
      transition: 0.3s;
      animation-delay: 0.8s;
    }

    .hero a:hover {
      background: #ffd633;
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(255,204,0,0.6);
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media(max-width:768px){
      .hero h1 { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Thank You!</h1>
    <p>Your form has been submitted successfully. Our team will contact you shortly.</p>
    <a href="index.html">Go Back to Home</a>
  </section>
</body>
</html>
