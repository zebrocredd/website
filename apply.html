<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply Now - ZebroCredd</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #f9f9f9; color: #222; }

    /* HERO BANNER */
    .apply-hero {
      height: 60vh;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
        url('https://images.unsplash.com/photo-1600880292203-757bb62b4baf?auto=format&fit=crop&w=1600&q=80')
        center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #fff;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .apply-hero::after {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(255,204,0,0.15), transparent 70%);
      animation: floatGlow 8s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes floatGlow {
      0% { transform: translate(-30px, -30px); }
      100% { transform: translate(30px, 30px); }
    }

    .apply-hero h1, .apply-hero p {
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(40px);
      animation: fadeUp 1s ease forwards;
    }

    .apply-hero h1 { font-size: 2.8rem; animation-delay: 0.3s; }
    .apply-hero p { margin-top: 15px; font-size: 1.15rem; max-width: 700px; animation-delay: 0.6s; }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Form Section */
    .form-section { padding: 60px 10%; display: flex; justify-content: center; }
    .form-box {
      width: 100%; max-width: 650px; background: #fff;
      padding: 40px; border-radius: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.1);
    }

    .form-box h2 {
      text-align: center; margin-bottom: 25px;
      font-size: 2rem; font-weight: 600; color: #222;
    }

    label { display: block; margin: 8px 0 5px; font-weight: 600; }
    input, select, textarea {
      width: 100%; padding: 12px; margin-bottom: 18px;
      border: 1px solid #ccc; border-radius: 8px;
      outline: none; transition: 0.3s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #ffcc00; box-shadow: 0 0 6px rgba(255,204,0,0.4);
    }

    button {
      width: 100%; padding: 14px;
      background: #ffcc00; border: none; border-radius: 30px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #ffdd33; transform: scale(1.05); }

  </style>
</head>

<body>

  <!-- HERO -->
  <section class="apply-hero">
    <h1>Apply for Your Financial Service</h1>
    <p>Choose your loan or insurance type, fill your details, and our team will contact you soon.</p>
  </section>

  <!-- FORM -->
  <section class="form-section">
    <div class="form-box">
      <h2>Application Form</h2>

      <form action="https://formspree.io/f/xeonazwq" method="POST">

        <!-- REDIRECT AFTER SUBMIT -->
        <input type="hidden" name="_redirect" value="thank_you_page.html">

        <label>Full Name</label>
        <input name="full_name" type="text" placeholder="Enter your full name" required>

        <label>Mobile Number</label>
        <input name="mobile" type="text" placeholder="Enter your mobile number" required>

        <label>Email Address</label>
        <input name="email" type="email" placeholder="Enter your email" required>

        <label>Select Category</label>
        <select id="serviceSelect" name="main_service" required>
          <option value="">-- Choose Category --</option>
          <option value="loan">Loan Services</option>
          <option value="insurance">Insurance Services</option>
        </select>

        <!-- Loan Type -->
        <div id="loanTypeBox" style="display:none;">
          <label>Select Loan Type</label>
          <select name="loan_type">
            <option value="">-- Select Loan Type --</option>
            <option>Personal Loan</option>
            <option>Home Loan</option>
            <option>Business Loan</option>
            <option>Vehicle Loan</option>
            <option>Education Loan</option>
            <option>Property Loan</option>
            <option>LAP Loan</option>
            <option>Other Loan</option>
          </select>
        </div>

        <!-- Insurance Type -->
        <div id="insuranceTypeBox" style="display:none;">
          <label>Select Insurance Type</label>
          <select name="insurance_type">
            <option value="">-- Select Insurance Type --</option>
            <option>Health Insurance</option>
            <option>Life Insurance</option>
            <option>Vehicle Insurance</option>
            <option>Home Insurance</option>
            <option>Travel Insurance</option>
            <option>Other Insurance</option>
          </select>
        </div>

        <!-- Loan Details -->
        <div id="loanDetails" style="display:none;">
          <label>Required Loan Amount</label>
          <input name="loan_amount" type="text" placeholder="Enter amount (₹)">

          <label>Monthly Income</label>
          <input name="monthly_income" type="text" placeholder="Your monthly income">

          <label>Employment Type</label>
          <select name="employment_type">
            <option>Salaried</option>
            <option>Self-Employed</option>
            <option>Business Owner</option>
            <option>Student</option>
          </select>

          <label>City</label>
          <input name="city" type="text" placeholder="Your city">
        </div>

        <!-- Insurance Details -->
        <div id="insuranceDetails" style="display:none;">
          <label>Coverage Required</label>
          <input name="coverage_amount" type="text" placeholder="Coverage amount (₹)">

          <label>Age</label>
          <input name="age" type="number" placeholder="Your age">

          <label>Existing Insurance?</label>
          <select name="existing_insurance">
            <option>No</option>
            <option>Yes</option>
          </select>
        </div>

        <label>Message</label>
        <textarea name="message" rows="4" placeholder="Write your message (optional)"></textarea>

        <button type="submit">Submit Application</button>
      </form>
    </div>
  </section>

  <script>
    const serviceSelect = document.getElementById('serviceSelect');
    const loanTypeBox = document.getElementById('loanTypeBox');
    const insuranceTypeBox = document.getElementById('insuranceTypeBox');
    const loanDetails = document.getElementById('loanDetails');
    const insuranceDetails = document.getElementById('insuranceDetails');

    serviceSelect.addEventListener('change', function() {
      const value = this.value;

      loanTypeBox.style.display = (value === 'loan') ? 'block' : 'none';
      loanDetails.style.display = (value === 'loan') ? 'block' : 'none';

      insuranceTypeBox.style.display = (value === 'insurance') ? 'block' : 'none';
      insuranceDetails.style.display = (value === 'insurance') ? 'block' : 'none';
    });
  </script>

</body>
</html>
