<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | ZebroCredd</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #fff;
      background: radial-gradient(circle at top left, #000 0%, #111 60%, #1a1a1a 100%);
      overflow-x: hidden;
      overflow-y: auto;
      padding: 40px 15px 80px;
      position: relative;
    }

    /* Subtle animated background glow */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, rgba(255,204,0,0.15), transparent, rgba(255,204,0,0.05), transparent);
      animation: rotateGlow 15s linear infinite;
      z-index: 0;
    }

    @keyframes rotateGlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 2;
      max-width: 750px;
      width: 100%;
      padding: 40px 25px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 204, 0, 0.2);
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(255, 204, 0, 0.1);
      animation: fadeUp 1.2s ease-out forwards;
      opacity: 0;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo img {
      width: 120px;
      height: auto;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 0 25px rgba(255,204,0,0.3);
      animation: glowPulse 3s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 25px rgba(255,204,0,0.3); }
      50% { box-shadow: 0 0 40px rgba(255,204,0,0.6); }
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #ffcc00;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    /* 404 Text */
    .error-code {
      font-size: 9rem;
      font-weight: 700;
      letter-spacing: 4px;
      margin: 20px 0 10px;
      background: linear-gradient(180deg, #ffcc00, #c79b00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 25px rgba(255,204,0,0.25);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .message {
      font-size: 1.2rem;
      color: #ddd;
      margin: 20px auto 40px;
      line-height: 1.7;
      max-width: 650px;
    }

    /* Home Button */
    .home-btn {
      display: inline-block;
      background: #ffcc00;
      color: #000;
      padding: 14px 40px;
      border-radius: 30px;
      font-weight: 600;
      text-decoration: none;
      font-size: 1rem;
      box-shadow: 0 5px 18px rgba(255,204,0,0.4);
      transition: all 0.35s ease;
    }

    .home-btn:hover {
      background: #ffd633;
      transform: translateY(-3px);
      box-shadow: 0 7px 22px rgba(255,204,0,0.6);
    }

    /* Social icons */
    .social {
      margin-top: 45px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .social a {
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,204,0,0.15);
      border: 1px solid rgba(255,204,0,0.3);
      color: #ffcc00;
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }

    .social a:hover {
      background: #ffcc00;
      color: #000;
      transform: translateY(-3px);
      box-shadow: 0 0 18px rgba(255,204,0,0.6);
    }

    footer {
      text-align: center;
      color: #aaa;
      font-size: 0.95rem;
      margin-top: 50px;
      letter-spacing: 0.3px;
      z-index: 2;
    }

    footer strong {
      color: #ffcc00;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .error-code { font-size: 6.5rem; }
      .message { font-size: 1rem; }
      .logo h1 { font-size: 1.6rem; }
      .container { padding: 30px 20px; }
      footer { font-size: 0.85rem; margin-top: 40px; }
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <img src="https://zebrocredd.github.io/Docs/zebrocredd%20logo.jpg" alt="ZebroCredd Logo">
      <h1>ZebroCredd</h1>
    </div>

    <div class="error-code">404</div>

    <p class="message">
      The page you are looking for doesn’t exist, may have been moved,<br>
      or is temporarily unavailable. Please check the URL or return home.
    </p>

    <a href="index.html" class="home-btn">Back to Home</a>

    <div class="social">
      <a href="https://www.facebook.com/share/1BYHHL6vXH/"><i class="fab fa-facebook-f"></i></a>
      <a href="https://www.instagram.com/zebrocredd"><i class="fab fa-instagram"></i></a>
      <a href="https://wa.me/+919855541715"><i class="fab fa-whatsapp"></i></a>
    </div>
  </div>

  <footer>
    © 2025 <strong>ZebroCredd</strong>. All Rights Reserved.
  </footer>

</body>
</html>
